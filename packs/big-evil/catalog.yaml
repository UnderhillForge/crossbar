# flavor: v7. A later pack sets flavor: linux31 and ships its own catalog.yaml
# plus tree/. The interpreter reads this file; it does not hardcode the command list.
flavor: v7
# Door period. The Greyline PAD has no era. File mtimes stay inside this range.
era: "1985-1993"
uname: "BEC PDP-11/70 UNIX V7"
uname_mf: "BEC-MF PDP-11/70 UNIX V7"
path: /bin:/usr/bin
unix:
  mode: "755"
  uid: 0
  gid: 0
  size: 40960
  mtime: "Sep 25  1985"
df:
