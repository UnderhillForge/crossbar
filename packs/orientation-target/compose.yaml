# Floor 0 annex. Private prop. Not part of the Grayline nginx site.
# No host ports are published. The lab is reachable only on this bridge.
#
# A later door proxy on the Crossbar machine, if one is added, could bind
# loopback only, for example 127.0.0.1:8765:8080. Do not add that publish
# here. Do not listen on 0.0.0.0:80 on the VPS.

services:
  orientation-target:
    build: .
    environment:
      FLAG_OPEN: "1"
    networks:
      - lab
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  lab:
    internal: true
